name: Dictionary formatting

on:
  pull_request:
    paths:
      - 'js/index.js'
      - 'index.html'
      - 'neologisms.csv'
      - 'styles.css'
      - 'offline/register.js'
      - 'docs/dict-conjugated.json.gz'
      - 'scripts/qa/sample_dictionary_entries.py'
      - 'scripts/data/source_inventory.py'
      - 'docs/primary_sources/DTAbib.txt'
      - 'docs/primary_sources/vlb/*.png'
      - 'vlb/**'
      - 'tests/dictionary_formatting.test.cjs'
      - 'tests/vlb_dictionary_links.test.cjs'
      - 'tests/vlb_citation_targets.test.cjs'
      - 'tests/vlb_correction_regressions.test.cjs'
      - 'tests/vlb_search.test.cjs'
      - 'tests/test_vlb_citation_inventory.py'
      - 'tests/test_vlb_viewer_data.py'
      - 'tests/test_vlb_orthography.py'
      - 'tests/test_vlb_mining_pipeline.py'
      - 'tests/test_vlb_mining_v2.py'
      - 'tests/test_vlb_mining_v3*.py'
      - 'tests/test_vlb_corrections.py'
      - 'tests/test_vlb_reverse_concordance.py'
      - 'tests/vlb_viewer_browser.cjs'
      - 'tests/dictionary_formatting_browser.py'
      - '.github/workflows/dictionary-formatting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/dictionary-formatting.yml
            /docs/dict-conjugated.json.gz
            /docs/primary_sources/DTAbib.txt
            /docs/primary_sources/vlb/17.png
            /docs/primary_sources/vlb/18.png
            /docs/primary_sources/vlb/19.png
            /docs/primary_sources/vlb/25.png
            /docs/primary_sources/vlb/26.png
            /docs/primary_sources/vlb/161.png
            /docs/primary_sources/vlb/231.png
            /docs/primary_sources/vlb/232.png
            /docs/primary_sources/vlb/292.png
            /docs/primary_sources/vlb/303.png
            /favicon.ico
            /index.html
            /neologisms.csv
            /js/index.js
            /js/pako.min.js
            /js/papaparse.min.js
            /manifest.json
            /offline/register.js
            /scripts/qa/sample_dictionary_entries.py
            /scripts/data/source_inventory.py
            /styles.css
            /tests/dictionary_formatting.test.cjs
            /tests/vlb_dictionary_links.test.cjs
            /tests/vlb_citation_targets.test.cjs
            /tests/vlb_correction_regressions.test.cjs
            /tests/vlb_search.test.cjs
            /tests/test_vlb_citation_inventory.py
            /tests/test_vlb_viewer_data.py
            /tests/test_vlb_orthography.py
            /tests/test_vlb_mining_pipeline.py
            /tests/test_vlb_mining_v2.py
            /tests/test_vlb_mining_v3.py
            /tests/test_vlb_mining_v3_evaluation.py
            /tests/test_vlb_mining_v3_fixture.py
            /tests/test_vlb_corrections.py
            /tests/test_vlb_reverse_concordance.py
            /tests/vlb_viewer_browser.cjs
            /tests/dictionary_formatting_browser.py
            /vlb/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/dictionary_formatting.test.cjs
      - run: node --test tests/vlb_dictionary_links.test.cjs
      - run: node --test tests/vlb_citation_targets.test.cjs
      - run: node --test tests/vlb_correction_regressions.test.cjs
      - run: node --test tests/vlb_search.test.cjs
      - run: python tests/test_vlb_citation_inventory.py
      - name: Rebuild deterministic VLB reader data
        run: |
          python vlb/build_data.py
          git diff --exit-code -- vlb/data
      - run: python tests/test_vlb_viewer_data.py
      - run: python -m unittest discover -s tests -p 'test_vlb_orthography.py' -v
      - run: python -m unittest discover -s tests -p 'test_vlb_mining*.py' -v
      - run: python -m unittest tests.test_vlb_reverse_concordance -v
      - run: python -m unittest tests.test_vlb_corrections -v
      - run: python vlb/manage_corrections.py validate
      - run: node vlb/evaluate_corrections.cjs --check
      - run: python vlb/mining/benchmark/validate_fixture.py
      - run: python vlb/mining/benchmark-v3/validate_fixture.py
      - run: python vlb/mining/benchmark-v3/validate_annotations.py
      - name: Reproduce frozen V3 evaluation
        run: |
          python vlb/mining/evaluate_v3.py
          git diff --exit-code -- vlb/mining/output-v3/REPORT.md vlb/mining/output-v3/test_labels-evaluation.json
      - run: python -m pip install playwright==1.55.0
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/dictionary_formatting_browser.py
      - name: Exercise VLB reader in Chromium
        run: node tests/vlb_viewer_browser.cjs
        env:
          VLB_QA_DIR: ${{ runner.temp }}/vlb-browser-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlb-browser-qa
          path: ${{ runner.temp }}/vlb-browser-qa
          if-no-files-found: ignore
