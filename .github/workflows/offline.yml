name: Offline library and Android shell
on:
  pull_request:
    paths:
      - 'android/**'
      - 'offline/**'
      - 'scripts/build_offline.py'
      - 'scripts/stage_android.py'
      - 'scripts/gradle_bootstrap.py'
      - 'scripts/test_offline_native.sh'
      - 'tests/offline/**'
      - 'Makefile'
      - 'manifest.json'
      - '.github/workflows/offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /android/
            /offline/
            /scripts/
            /tests/offline/
            /Makefile
            /manifest.json
            /index.html
            /styles.css
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==12.3.0
      - run: make offline-test
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: make offline-browser-test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /android/
            /scripts/gradle_bootstrap.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./android/gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nheenga-debug-shell
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
