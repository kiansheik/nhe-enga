<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fontes primárias — Nhe'enga</title>
    <style>
        body {
            margin: 1rem;
            font-family: sans-serif;
            height: calc(100vh - 2rem);
            height: calc(100dvh - 2rem);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: auto auto auto minmax(0, 1fr);
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.2rem;
        }
        #sourceDetails p {
            margin: 0.5rem 0;
        }
        #sourceDetails {
            grid-row: 1;
        }
        #navigation {
            grid-row: 2;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.75rem 0;
        }
        #navigation button {
            min-height: 2rem;
        }
        #imageError {
            grid-row: 3;
        }
        #pageImage {
            grid-row: 4;
            align-self: start;
            justify-self: center;
            display: block;
            min-width: 0;
            min-height: 0;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            margin: 0 auto;
            cursor: zoom-in;
        }
        body.zoomed {
            display: block;
            height: auto;
        }
        body.zoomed #pageImage {
            max-width: none;
            max-height: none;
            cursor: zoom-out;
        }
    </style>
</head>
<body>
    <header id="sourceDetails" hidden>
        <h1 id="sourceTitle"></h1>
        <p id="sourceEdition"></p>
        <p id="sourceNotice" role="note" hidden></p>
        <p>
            <a id="sourceInfo" target="_blank" rel="noopener">Digitalização: Biblioteca Digital Curt Nimuendajú — Coleção Nicolai</a>
            · <a id="sourcePdf" target="_blank" rel="noopener">Abrir PDF nesta página</a>
        </p>
    </header>
    <div id="navigation">
        <button id="prevPage">Anterior</button>
        <span id="currentPage" aria-live="polite"></span>
        <button id="nextPage">Próxima</button>
        <button id="zoomPage" aria-pressed="false">Ampliar</button>
        <a id="openImage" target="_blank" rel="noopener">Abrir imagem</a>
    </div>
    <p id="imageError" role="status" hidden>Não foi possível carregar esta página. Tente abrir a imagem ou o PDF.</p>
    <script>
        // This edition is the one listed in Navarro's bibliography (DTAbib.txt).
        // Printed page p = scan p.jpg = PDF page p + 1. The scan also includes
        // an unnumbered cover (0), preliminaries (1–13), and final blank (443).
        const sourceEditions = {
            evreux1929: {
                title: "Yves d’Évreux — Viagem ao Norte do Brasil",
                edition: "Rio de Janeiro, 1929 · Tradução de César Augusto Marques",
                firstScan: 0,
                lastScan: 443,
                firstPrintedPage: 14,
                lastPrintedPage: 442,
                bibliographyUrl: "https://www.etnolinguistica.org/biblio:evreux-1929-viagem",
                pdfUrl: "https://archive.org/download/evreux-1929-viagem-ao-norte-do-brasil/Evreux_1929_ViagemAoNorteDoBrasil.pdf",
            },
        };
        function generateArcat1618Page(n) {
            let page = parseInt(n.replace('v', ''));
            page -= n >= 129? 1 : 0;
            page = page * 2 + 34;
            if (n.length !== n.replace('v', '').length) {
                page += 1;
            }
            return page;
        }
        function calculateNFromPage(page) {
            if (bookName === 'arcat1618') {
                let nValue;
                if ((page - 35) % 2 === 0) {
                    nValue = ((page - 35) / 2).toString();
                    if (+nValue >= 129) {
                        nValue = +nValue + 1;
                    }
                    nValue += 'v';
                } else {
                    nValue = ((page - 34) / 2).toString();
                    if (+nValue >= 129) {
                        nValue = +nValue + 1;
                    }
                }
                return nValue;
            } else {
                return page;
            }
        }
        const anchieta_arte_page_map = [['1'], ['01a', '02'], ['02a', '03'], ['03a', '04'], ['04a', '05'], ['05a', '06'], ['06a', '07'], ['07a', '08'], ['08a', '09'], ['09a', '10'], ['10a', '11'], ['11a', '12'], ['12a', '13'], ['13a', '14'], ['14a', '15'], ['15a', '16'], ['16a', '17'], ['17a', '18'], ['18a', '19'], ['19a', '20'], ['20a', '21'], ['21a', '22'], ['22a', '23'], ['23a', '24'], ['24a', '25'], ['25a', '26'], ['26a', '27'], ['27a', '28'], ['28a', '29'], ['29a', '30'], ['30a', '31'], ['31a', '32'], ['32a', '33'], ['33a', '34'], ['34a', '35'], ['35a', '36'], ['36a', '37'], ['37a', '38'], ['38a', '39'], ['39a', '40'], ['40a', '41'], ['41a', '42'], ['42a', '43'], ['43a', '44'], ['44a', '45'], ['45a', '46'], ['46a', '47'], ['47a', '48'], ['48a', '49'], ['49a', '50'], ['50a', '51'], ['51a', '52'], ['52a', '53'], ['53a', '54'], ['54a', '55'], ['55a', '56'], ['56a', '57'], ['57a', '58'], ['58a']];
        const defaultImageFormats = {
            ancharte: ".png",
            arcat1618: ".png",
            betcomp: ".jpg",
            cartas_portiguara: ".jpg",
            castilho1937: ".jpg",
            evreux1929: ".jpg",
            figueira1878: ".jpg",
            lerhist: ".jpg",
            vlb: ".png",
        };
        let imageFormats = { ...defaultImageFormats };
        async function loadImageFormats() {
            try {
                const response = await fetch("/nhe-enga/docs/primary_sources/image-formats.json");
                if (!response.ok) {
                    return;
                }
                const data = await response.json();
                if (data && data.books) {
                    imageFormats = { ...imageFormats, ...data.books };
                }
            } catch (_error) {
                return;
            }
        }
        function imageFormatForBook(name) {
            return imageFormats[name] || defaultImageFormats[name] || ".png";
        }
        const manifestBookNames = new Set(["figueira1878", "castilho1937"]);
        const urlParams = new URLSearchParams(window.location.search);
        let bookName = urlParams.get('book_name');
        let edition = Object.prototype.hasOwnProperty.call(sourceEditions, bookName) ? sourceEditions[bookName] : null;
        let sourceManifest = null;
        let manifestTargets = [];
        let manifestPosition = 0;
        let pageNumber;
        let pn;
        let isZoomed = false;

        function showSourceDetails(title, editionText, catalogUrl, credit) {
            document.getElementById('sourceDetails').hidden = false;
            document.getElementById('sourceTitle').textContent = title;
            document.getElementById('sourceEdition').textContent = editionText;
            const sourceInfo = document.getElementById('sourceInfo');
            sourceInfo.href = catalogUrl;
            sourceInfo.textContent = `Digitalização: ${credit}`;
        }

        function initializeLegacyViewer() {
            if (bookName === 'vlb' || bookName === 'betcomp' || bookName === 'lerhist') {
                pageNumber = parseInt(urlParams.get('page_number'), 10);
            } else if (bookName === 'arcat1618') {
                pageNumber = generateArcat1618Page(urlParams.get('page_number'));
            } else if (bookName === 'ancharte') {
                let requested = urlParams.get('page_number').replace('v', 'a');
                if (requested.replace('a', '').length < 2) {
                    requested = '0' + requested;
                }
                pageNumber = anchieta_arte_page_map.findIndex((pages) => pages.includes(requested));
            }
            if (edition) {
                const requestedPage = urlParams.get('page_number');
                const parsedPage = /^-?\d+$/.test(requestedPage || '') ? Number(requestedPage) : 1;
                pageNumber = Math.min(edition.lastScan, Math.max(edition.firstScan, parsedPage));
                showSourceDetails(
                    edition.title,
                    edition.edition,
                    edition.bibliographyUrl,
                    'Biblioteca Digital Curt Nimuendajú — Coleção Nicolai',
                );
                updateUrl();
            }
        }

        async function loadSourceManifest() {
            if (!manifestBookNames.has(bookName)) return;
            const response = await fetch(`/nhe-enga/docs/primary_sources/${bookName}/source.json`);
            if (!response.ok) throw new Error('source manifest unavailable');
            sourceManifest = await response.json();
            edition = sourceManifest;
            const editionText = bookName === 'castilho1937'
                ? `${sourceManifest.edition} · somente as 16 páginas citadas estão armazenadas`
                : `${sourceManifest.edition} · volume completo`;
            showSourceDetails(
                `${sourceManifest.author} — ${sourceManifest.title}`,
                editionText,
                sourceManifest.catalog_url,
                sourceManifest.digitization_credit,
            );
            if (bookName === 'figueira1878' && urlParams.get('citation_year') === '1686') {
                const notice = document.getElementById('sourceNotice');
                notice.textContent = 'Nota sobre a citação: o dicionário conserva “1686”, mas a bibliografia e os catálogos identificam esta edição como 1687; o trecho citado foi conferido nesta página 64.';
                notice.hidden = false;
            }
            const requestedPage = urlParams.get('page_number');
            if (sourceManifest.pagination?.navigation === 'complete_scan') {
                const pagination = sourceManifest.pagination;
                const requestedPrinted = /^\d+$/.test(requestedPage || '') ? Number(requestedPage) : null;
                const requestedScanValue = urlParams.get('scan');
                const requestedScan = /^\d+$/.test(requestedScanValue || '') ? Number(requestedScanValue) : null;
                if (urlParams.has('page_number')
                    && (requestedPrinted === null
                        || requestedPrinted < pagination.first_printed_page
                        || requestedPrinted > pagination.last_printed_page)) {
                    throw new Error('printed page is outside the verified map');
                }
                if (urlParams.has('scan')
                    && (requestedScan === null
                        || requestedScan < sourceManifest.images.first_index
                        || requestedScan > sourceManifest.images.last_index)) {
                    throw new Error('scan is outside the stored volume');
                }
                if (requestedPrinted !== null) {
                    pageNumber = requestedPrinted + pagination.printed_page_to_pdf_index_offset;
                } else if (requestedScan !== null) {
                    pageNumber = requestedScan;
                } else {
                    pageNumber = sourceManifest.images.first_index;
                }
            } else {
                manifestTargets = sourceManifest.mapping.targets;
                const requestedPosition = manifestTargets.findIndex((target) => target.locator === requestedPage);
                if (urlParams.has('page_number') && requestedPosition < 0) {
                    throw new Error('printed page is outside the verified map');
                }
                manifestPosition = requestedPosition >= 0 ? requestedPosition : 0;
                pageNumber = manifestTargets[manifestPosition].pdf_index;
                document.getElementById('prevPage').textContent = 'Página citada anterior';
                document.getElementById('nextPage').textContent = 'Próxima página citada';
            }
            updateUrl();
        }

        function currentManifestTarget() {
            if (!sourceManifest) return null;
            if (sourceManifest.pagination?.navigation === 'complete_scan') {
                const pagination = sourceManifest.pagination;
                const printedPage = pageNumber - pagination.printed_page_to_pdf_index_offset;
                return {
                    locator: printedPage >= pagination.first_printed_page && printedPage <= pagination.last_printed_page
                        ? String(printedPage) : null,
                    printed_page: printedPage,
                    pdf_index: pageNumber,
                    pdf_ordinal: pageNumber + 1,
                    image: `${pageNumber}${imageFormatForBook(bookName)}`,
                    scan_side: 'full',
                };
            }
            return manifestTargets[manifestPosition];
        }

        function updateUrl() {
            if (sourceManifest) {
                const target = currentManifestTarget();
                if (target.locator !== null) {
                    urlParams.set('page_number', target.locator);
                    urlParams.delete('scan');
                } else {
                    urlParams.delete('page_number');
                    urlParams.set('scan', String(target.pdf_index));
                }
                if (bookName === 'figueira1878' && target.locator !== '64') {
                    urlParams.delete('citation_year');
                    document.getElementById('sourceNotice').hidden = true;
                }
                window.history.replaceState(null, '', `${window.location.pathname}?${urlParams}`);
                return;
            }
            urlParams.set('page_number', calculateNFromPage(pageNumber));
            window.history.replaceState(null, '', `${window.location.pathname}?${urlParams}`);
        }

        function pageLabel() {
            if (sourceManifest) {
                const target = currentManifestTarget();
                if (bookName === 'castilho1937') {
                    const side = target.scan_side === 'left' ? 'lado esquerdo' : 'lado direito';
                    return `Página impressa ${target.printed_page} · ${side} · PDF página ${target.pdf_ordinal}`;
                }
                const pagination = sourceManifest.pagination;
                if (pageNumber === pagination.title_page_index) {
                    return `Folha de rosto de 1878 · imagem ${pageNumber + 1} de ${sourceManifest.pdf.page_count}`;
                }
                if (target.locator !== null) {
                    return `Página impressa ${target.printed_page} de ${pagination.last_printed_page} · PDF página ${target.pdf_ordinal}`;
                }
                if (pageNumber === pagination.errata_index) {
                    return `Errata sem numeração · PDF página ${target.pdf_ordinal}`;
                }
                const section = pageNumber < pagination.first_printed_page + pagination.printed_page_to_pdf_index_offset
                    ? 'Preliminar sem numeração' : 'Pós-texto sem numeração';
                return `${section} · imagem ${pageNumber + 1} de ${sourceManifest.pdf.page_count}`;
            }
            if (edition) {
                if (pageNumber === edition.firstScan) return 'Capa (sem numeração)';
                if (pageNumber < edition.firstPrintedPage) return `Preliminares ${pageNumber} de ${edition.firstPrintedPage - 1} (sem numeração)`;
                if (pageNumber === edition.lastScan) return 'Página final em branco (sem numeração)';
                return `Página ${pageNumber} de ${edition.lastPrintedPage}`;
            }
            // Legacy books have different offsets/folio maps; do not present
            // their scan indices as printed pagination.
            return `Imagem ${pageNumber}`;
        }
        function toggleZoom() {
            isZoomed = !isZoomed;
            document.body.classList.toggle('zoomed', isZoomed);
            const button = document.getElementById('zoomPage');
            button.textContent = isZoomed ? 'Ajustar à tela' : 'Ampliar';
            button.setAttribute('aria-pressed', String(isZoomed));
        }
        // Function to update the image based on the current page number
        function updateImage() {
            const body = document.body;
            if (bookName === 'ancharte'){
                const text_link = document.createElement('a');
                pn = anchieta_arte_page_map[pageNumber][0];
                text_link.href = `http://www.etnolinguistica.org/arte:${pn}`;
                text_link.id = 'text_link_src';
                text_link.textContent = 'Ver essa página em texto';
                const existinglink= document.querySelector('#text_link_src');
                const nav = document.querySelector('#navigation');
                if (existinglink) {
                    nav.removeChild(existinglink);
                }
                // Append the new image
                nav.appendChild(text_link);
            }

            const manifestTarget = currentManifestTarget();
            const imageName = manifestTarget ? manifestTarget.image : `${pageNumber}${imageFormatForBook(bookName)}`;
            const imageUrl = `/nhe-enga/docs/primary_sources/${bookName}/${imageName}`;
            const image = document.createElement('img');
            image.id = 'pageImage';
            image.src = imageUrl;
            image.alt = `${pageLabel()} — ${edition ? edition.title : bookName}`;
            image.addEventListener('click', toggleZoom);
            document.getElementById('imageError').hidden = true;
            image.addEventListener('error', () => {
                document.getElementById('imageError').hidden = false;
            });
            document.getElementById('currentPage').textContent = pageLabel();
            if (sourceManifest?.pagination?.navigation === 'complete_scan') {
                document.getElementById('prevPage').disabled = pageNumber <= sourceManifest.images.first_index;
                document.getElementById('nextPage').disabled = pageNumber >= sourceManifest.images.last_index;
            } else if (sourceManifest) {
                document.getElementById('prevPage').disabled = manifestPosition === 0;
                document.getElementById('nextPage').disabled = manifestPosition === manifestTargets.length - 1;
            } else {
                document.getElementById('prevPage').disabled = pageNumber <= (edition ? edition.firstScan : 1);
                document.getElementById('nextPage').disabled = edition ? pageNumber >= edition.lastScan : false;
            }
            document.getElementById('openImage').href = imageUrl;
            if (sourceManifest) {
                document.title = `${sourceManifest.title} (${sourceManifest.year}) — ${pageLabel()}`;
                document.getElementById('sourcePdf').href = `${sourceManifest.pdf.url}#page=${manifestTarget.pdf_ordinal}`;
            } else if (edition) {
                document.title = `${edition.title} (1929) — ${pageLabel()}`;
                document.getElementById('sourcePdf').href = `${edition.pdfUrl}#page=${pageNumber + 1}`;
            }
            // Remove the existing image if any
            const existingImage = document.querySelector('img');
            if (existingImage) {
                body.removeChild(existingImage);
            }            

            body.appendChild(image);
        }

        initializeLegacyViewer();
        Promise.all([loadImageFormats(), loadSourceManifest()])
            .then(updateImage)
            .catch(() => {
                const error = document.getElementById('imageError');
                error.textContent = 'Não foi possível carregar o mapa desta fonte. Abra o PDF original ou tente novamente.';
                error.hidden = false;
                document.getElementById('prevPage').disabled = true;
                document.getElementById('nextPage').disabled = true;
            });

        // Add event listeners to buttons
        document.getElementById('prevPage').addEventListener('click', () => {
            if (sourceManifest?.pagination?.navigation === 'complete_scan') {
                if (pageNumber <= sourceManifest.images.first_index) return;
                pageNumber--;
            } else if (sourceManifest) {
                if (manifestPosition === 0) return;
                manifestPosition--;
                pageNumber = manifestTargets[manifestPosition].pdf_index;
            } else {
                if (pageNumber > (edition ? edition.firstScan : 1)) {
                    pageNumber--;
                }
            }
            updateImage();
            updateUrl();
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            if (sourceManifest?.pagination?.navigation === 'complete_scan') {
                if (pageNumber >= sourceManifest.images.last_index) return;
                pageNumber++;
            } else if (sourceManifest) {
                if (manifestPosition >= manifestTargets.length - 1) return;
                manifestPosition++;
                pageNumber = manifestTargets[manifestPosition].pdf_index;
            } else {
                if (edition && pageNumber >= edition.lastScan) return;
                pageNumber++;
            }
            updateImage();
            updateUrl();
        });
        document.getElementById('zoomPage').addEventListener('click', toggleZoom);
    </script>
</body>
</html>
